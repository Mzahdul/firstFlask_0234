<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Flask POST</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="box">
        <h2>Form Input Nama</h2>

        <form method="POST" action="/Kamu_HIHU">
            <input type="text" name="nama" placeholder="Masukkan nama" required>
            <button type="submit">Kirim</button>
        </form>

        {% if nama %}
            <p class="hasil">Halo, {{ nama }}!</p>
        {% endif %}
    </div>
</body>
</html>
